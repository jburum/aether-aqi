name: AetherAQI
options:
  bundleIdPrefix: llc.bbcvc
  deploymentTarget:
    iOS: "17.0"
targets:
  AetherAQI:
    type: application
    platform: iOS
    sources: [AetherAQI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: llc.bbcvc.aqi   # placeholder until BBCVC Apple Developer enrollment
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Air Quality Forecast
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Air Quality Forecast uses your location to show the air quality forecast where you are."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
